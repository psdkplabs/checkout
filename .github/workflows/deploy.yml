name: Build & Deploy SIP (DevSecOps Enabled)

on:
  push:
    branches:
      - internal
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write # Diperlukan agar hasil scan keamanan bisa tampil di tab Security GitHub

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  checks:
    name: Lint, Architecture & Security Checks # Dimodifikasi untuk mencakup SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Wajib 0 agar GitLeaks bisa memindai seluruh riwayat komit

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

      - name: Check feature boundaries
        run: bun run lint:boundaries

      - name: Check ESLint violations against baseline
        run: bun run lint:ci

      - name: Ensure ESLint baseline is in sync
        run: bun run lint:ci:check

      - name: Ensure lint does not modify tracked files
        run: git diff --exit-code

      # ==========================================
      # SECURITY GATE 1: CODE & SECRET SCAN
      # ==========================================
      - name: Secret Scan (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          extra_args: --debug

      - name: Set up Python for Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep
          semgrep --version

      - name: SAST Scan (Semgrep)
        run: |
          semgrep scan \
            --config p/default \
            --error \
            --metrics=off \
            .

  build-and-push:
    name: Build, Scan & Push Docker Image
    runs-on: ubuntu-latest
    needs: checks # Job ini tidak akan berjalan jika Gate 1 gagal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=internal
            type=sha,prefix=internal-

      - name: Inject environment variables
        env:
          ENV_INTERNAL: ${{ secrets.ENV_INTERNAL }}
        run: |
          if [ -z "$ENV_INTERNAL" ]; then
            echo "::error::ENV_INTERNAL is not set; cannot create apps/web/.env.internal."
            exit 1
          fi
          echo "$ENV_INTERNAL" > apps/web/.env.internal
          echo "Successfully created apps/web/.env.internal"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BUILD_MODE=internal
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================
      # SECURITY GATE 2: CONTAINER SCA SCAN
      # ==========================================
      - name: SCA Scan (Trivy Container Scan)
        uses: aquasecurity/trivy-action@master
        with:
          # Memindai image yang baru saja di-push menggunakan tag 'internal'
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:internal'
          format: 'table'
          exit-code: '1' # Gagalkan pipeline jika ditemukan celah
          severity: 'CRITICAL,HIGH'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy and verify
        # (Skrip Coolify bawaan tim Anda tetap tidak diubah sama sekali)
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_INTERNAL_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_BASE_URL: https://paus.psdkp.cloud
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_URL" ]; then
            echo "::error::COOLIFY_INTERNAL_WEBHOOK is not set; cannot trigger the deploy."
            exit 1
          fi

          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::COOLIFY_TOKEN is not set; cannot trigger the deploy."
            exit 1
          fi

          DEPLOY_IMAGE_TAG="$(echo "$IMAGE_TAGS" | grep -o 'internal-[0-9a-f]\{7,\}' | head -n 1)"

          if [ -z "$DEPLOY_IMAGE_TAG" ]; then
            echo "::error::Could not derive the image tag from: $IMAGE_TAGS"
            exit 1
          fi

          echo "Triggering Coolify deployment..."

          RESPONSE="$(curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_DEPLOY_URL")"

          DEPLOYMENT_UUID="$(printf '%s' "$RESPONSE" | node scripts/read-deployment-uuid.mjs)"

          echo "Coolify queued deployment $DEPLOYMENT_UUID."

          echo "Verifying deployment of $DEPLOY_IMAGE_TAG"
          COOLIFY_DEPLOYMENT_UUID="$DEPLOYMENT_UUID" \
            DEPLOY_IMAGE_TAG="$DEPLOY_IMAGE_TAG" \
            node scripts/verify-deploy.mjs

  # ==========================================
  # SECURITY GATE 3: DYNAMIC SCAN (DAST)
  # ==========================================
  dynamic-analysis:
    name: DAST Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build-and-push # Hanya berjalan jika deployment Coolify berhasil diverifikasi
    steps:
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          # Sesuaikan URL ini dengan endpoint internal yang dapat diakses publik.
          # Asumsi menggunakan virtual path /sip-internal berdasarkan konfigurasi Nginx kantor Anda.
          target: 'https://sipmdjpsdkp.kkp.go.id/sip-internal' 
          fail_action: true